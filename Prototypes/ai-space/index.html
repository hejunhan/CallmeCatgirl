<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI空间经营 · 玩法验证</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#e5e7eb;font:14px system-ui,"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;background:#1b2940}h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 12px}button,select{font:inherit;color:#e5e7eb;background:#293b56;border:1px solid #516784;border-radius:5px;padding:7px 10px}button{cursor:pointer}button:hover{background:#3d587e}button:disabled{opacity:.4;cursor:default}.primary{background:#247567}.layout{display:grid;grid-template-columns:230px minmax(390px,1fr) 320px;gap:16px;padding:18px;max-width:1500px;margin:auto}section{background:#19263a;border:1px solid #354762;border-radius:8px;padding:15px}.hint{font-size:12px;color:#adbed5;line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{padding:10px;background:#263852;border:1px solid #4b617e;border-left:4px solid var(--color);border-radius:5px;margin:8px 0;cursor:grab;touch-action:none}.card b{display:block}.card.sel{outline:2px solid white}#queue{border:1px dashed #6b829f;min-height:200px;max-height:470px;overflow:auto;padding:5px}canvas{display:block;max-width:100%;margin:15px auto;touch-action:none}label{display:block;margin:8px 0}.log{font-size:12px;color:#b8c7db;line-height:1.8;max-height:150px;overflow:auto}.big{font-size:23px;font-weight:bold}.result{border-bottom:1px solid #425472;padding:8px 0}.good{color:#86efac}.bad{color:#fda4af}#results{max-height:180px;overflow:auto}#lab{border-top:1px solid #465a76;margin-top:14px;padding-top:14px}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#f1f5f9;color:#15243a;padding:10px 18px;border-radius:5px;display:none}#stats{font-variant-numeric:tabular-nums}@media(max-width:1050px){.layout{grid-template-columns:210px minmax(340px,1fr)}.right{grid-column:1/-1}}@media(max-width:620px){.layout{display:flex;flex-direction:column;padding:8px}}
</style>
<header><h1>AI空间经营 · 玩法验证</h1><select id="mode"><option value="flow">90秒：流程＋调度</option><option value="basic">90秒：基础排程</option><option value="demo">25秒：原文A/B/C</option></select><button id="start" class="primary">开始本轮</button><button id="pauseAll">暂停全局</button><label style="margin:0">速度 <select id="speed"><option value="0.25">0.25倍</option><option value="0.5" selected>0.5倍</option><option value="1">1倍</option></select></label><button id="reset">重开</button><span id="stats"></span></header>
<main class="layout"><section><h2>待处理请求</h2><p class="hint">卡片拖入棋盘。点击后按 R 旋转。运行任务可拖回来撤回，期限继续。</p><div id="queue"></div><h2 style="margin-top:15px">用户反馈</h2><div id="results"></div></section>
<section><h2>运算空间 <span id="occupied" class="hint"></span></h2><canvas id="board"></canvas><div class="row"><button id="rotate">旋转 R</button><button id="pauseTask">暂停此任务</button><button id="withdraw">撤回</button><button id="add">追加请求</button></div><p class="hint">默认0.5倍速。点击棋盘任务后可独立暂停：仍占空间，期限继续；全局暂停冻结所有计时。拖拽时原位继续工作，非法落下恢复原位。先选方案，再放入任务；放入后方案锁定。</p><div class="row"><span>达标／失败 <b id="score" class="big"></b></span><span>净收入 <b id="money" class="big"></b></span></div><div id="growth"></div><details style="margin-top:14px"><summary>验证开关与日志</summary><label><input type="checkbox" id="xp" checked> 格子经验：匹配类型最多加速16%</label><label><input type="checkbox" id="bias" checked> 声望改变后续客源类型</label><label><input type="checkbox" id="debug"> 显示真实难度</label><button id="step">调试：暂停并推进1秒</button><button id="resume">继续运行</button><div id="log" class="log"></div></details></section>
<section class="right"><h2>请求与处理方案</h2><div id="detail" class="hint"></div><div id="chooser"><label>处理方案<select id="plan" style="width:100%"></select></label><div id="planInfo" class="hint"></div></div><div id="trace" class="log"></div><h2 style="margin-top:16px">记忆</h2><div id="memory" class="hint"></div><div id="lab"><h2>快速流程工作台</h2><div class="hint">生成固定3格／3秒，修正2秒。这里组合模块和回流，保存后每单自动执行。</div><label><input id="lGet" type="checkbox" checked> 获取：2格／4秒</label><label><input id="lCheck" type="checkbox" checked> 检查：2格／2秒</label><label><input id="lRead" type="checkbox"> 读取：1格／1秒</label><label><input id="lWrite" type="checkbox"> 写入：1格／1秒</label><label>返工上限 <select id="lLoops"><option>0</option><option>1</option><option selected>2</option></select></label><label>布局宽度 <select id="lWidth"><option>2</option><option>3</option></select></label><div id="labInfo" class="hint"></div><button id="save">保存自定义方案</button></div></section></main><div id="toast"></div>
<script src="engine.js"></script><script>
'use strict';
var $=id=>document.getElementById(id),colors=['#60a5fa','#c084fc','#34d399'],game,selected,playing=false,drag=null,last=performance.now(),lastRender=0,canvas=$('board'),ctx=canvas.getContext('2d'),cell=64;
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2200);}
function current(){return game.tasks.find(t=>t.id===selected);}
function options(){var v=$('plan').value;$('plan').innerHTML=game.plans.map((p,i)=>'<option value="'+i+'">'+p.name+' · '+Proto.size(p)+'格</option>').join('');$('plan').value=game.plans[v]?v:'0';}
function reset(){game=new Proto.Game($('mode').value,{xp:$('xp').checked,bias:$('bias').checked});selected=game.tasks[0].id;playing=false;drag=null;canvas.width=game.cols*cell;canvas.height=game.rows*cell;options();$('start').textContent='开始本轮';render();}
function stage(t){if(t.state==='running'&&t.paused)return '已暂停';if(t.state==='done')return '完成待回复';if(t.state==='failed')return '失败待反馈';if(t.state==='closed')return '已回复';return t.state==='queued'?'待安排':t.state==='withdrawn'?'已撤回':({base:'计算',read:'读取',get:'获取',generate:'生成',check:'检查',repair:'修正',write:'写入'})[t.stage]||t.state;}
function info(p){var base=3+(p.get?4:0)+(p.check?2:0)+(p.read?1:0)+(p.write?1:0);return Proto.size(p)+'格 · '+(p.read?'记忆命中省去获取，未命中需后备':'无返工'+base+'秒')+' · 每次返工+4秒<br>'+(p.read?'读取 → ':'')+(p.get?'获取（命中跳过） → ':'')+'生成'+(p.check?' → 检查':'')+(p.write?' → 写入':'')+' → 交付';}
function lab(){return{name:'自定义 '+(game.plans.length-4),get:$('lGet').checked,check:$('lCheck').checked,read:$('lRead').checked,write:$('lWrite').checked,loops:$('lCheck').checked?Number($('lLoops').value):0,width:Number($('lWidth').value)};}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.font='12px system-ui';for(var y=0;y<game.rows;y++)for(var x=0;x<game.cols;x++){var e=game.experience[y][x];ctx.fillStyle=game.xp&&e.n?colors[e.type]+'25':'#101b2c';ctx.fillRect(x*cell,y*cell,cell,cell);ctx.strokeStyle='#3f516b';ctx.strokeRect(x*cell+.5,y*cell+.5,cell-1,cell-1);if(game.xp&&e.n){ctx.fillStyle=colors[e.type];ctx.fillText(['码','聊','规'][e.type]+'·'+e.n,x*cell+5,y*cell+16);}}
for(var t of game.tasks.filter(t=>t.state==='running')){for(var c of t.cells){ctx.fillStyle=colors[t.type]+'c0';ctx.fillRect((t.x+c[0])*cell+3,(t.y+c[1])*cell+3,cell-6,cell-6);if(t.id===selected){ctx.strokeStyle='white';ctx.strokeRect((t.x+c[0])*cell+3,(t.y+c[1])*cell+3,cell-6,cell-6);}}ctx.fillStyle='#071624';ctx.font='bold 12px system-ui';ctx.fillText('#'+t.id+' '+stage(t),t.x*cell+6,t.y*cell+22);ctx.fillRect(t.x*cell+6,t.y*cell+32,(cell-12)*Math.min(1,t.p/game.seconds(t)),5);ctx.fillText(Math.max(0,t.deadline-(t.finished===undefined?game.time:t.finished)).toFixed(1)+'s',t.x*cell+6,t.y*cell+53);}
if(drag){var t=game.tasks.find(t=>t.id===drag.id);if(t&&['queued','running','withdrawn'].includes(t.state)){ctx.fillStyle=game.legal(t,drag.cells,drag.x,drag.y)?'#86efac88':'#fda4af88';for(var c of drag.cells)ctx.fillRect((drag.x+c[0])*cell+5,(drag.y+c[1])*cell+5,cell-10,cell-10);}}}
function render(){var t=current();$('pauseTask').disabled=!t||t.state!=='running';$('pauseTask').textContent=t&&t.paused?'继续此任务':'暂停此任务';$('pauseAll').textContent=playing?'暂停全局':'继续全局';$('stats').textContent=game.time.toFixed(1)+' / '+game.duration+'秒 · '+(game.ended?'本轮结束':playing?'运行中':'等待开始／全局暂停');$('score').textContent=game.good+' / '+game.bad;$('money').textContent=game.money.toFixed(1)+'币';$('occupied').textContent=game.tasks.filter(t=>t.state==='running').reduce((a,t)=>a+t.cells.length,0)+' / '+game.cols*game.rows+'格';
if(!drag)$('queue').innerHTML=game.tasks.filter(t=>['queued','withdrawn'].includes(t.state)).map(t=>'<div class="card '+(t.id===selected?'sel':'')+'" data-id="'+t.id+'" style="--color:'+colors[t.type]+'"><b>'+t.name+'</b>'+Proto.types[t.type]+' · '+t.cells.length+'格 · 剩'+Math.max(0,t.deadline-(t.finished===undefined?game.time:t.finished)).toFixed(1)+'秒<div class="hint">'+(t.started?stage(t)+'（保留进度）':t.plan.name)+'</div></div>').join('')||'<span class="hint">暂无请求</span>';
$('results').innerHTML=game.tasks.filter(t=>['done','failed'].includes(t.state)).map(t=>'<div class="result"><b class="'+(t.ok?'good':'bad')+'">'+t.name+' '+(t.ok?'达标':'失败')+'</b><div class="hint">'+t.reason+' · 收'+t.income.toFixed(1)+'／费'+t.cost.toFixed(1)+'</div><button data-reply="'+t.id+'">回复</button><button data-inspect="'+t.id+'">详情</button></div>').join('')||'<span class="hint">完成后在这里回复</span>';
$('chooser').style.display=game.mode==='flow'?'block':'none';$('lab').style.display=game.mode==='flow'?'block':'none';if(t){var i=game.plans.findIndex(p=>p.name===t.plan.name);if(i>=0)$('plan').value=String(i);$('plan').disabled=t.started||t.state!=='queued';$('detail').innerHTML='<b style="color:'+colors[t.type]+'">'+t.name+' · '+Proto.types[t.type]+'</b><br>'+t.text+'<br>版本V'+t.version+' · '+t.token+' token<br>模型等级 '+(t.base===undefined?game.skills[t.type]:t.base)+' · '+($('debug').checked?'真实难度 '+t.level:['简单','简单','有查证需求','需反复核实'][Math.min(3,t.level)])+'<br>期限剩'+Math.max(0,t.deadline-(t.finished===undefined?game.time:t.finished)).toFixed(1)+'秒<br>当前 '+stage(t)+(t.started?' '+Math.round(t.p/game.seconds(t)*100)+'%':'')+' · 返工'+t.loops+'<br>已做'+t.work.toFixed(1)+'工作秒 · token '+Math.floor(t.bill)+' · 费用'+t.cost.toFixed(1)+(t.reason?'<br>'+t.reason:'');$('planInfo').innerHTML=info(t.plan);$('trace').innerHTML=t.trace.slice(-8).join('<br>');}
$('memory').innerHTML=game.mem.filter(m=>m.until>game.time).map(m=>Proto.types[m.type]+' · 难度'+m.level+' · V'+m.version+' · 剩'+Math.ceil(m.until-game.time)+'秒').join('<br>')||'无有效条目。通过“查证并记忆”保存。';$('log').innerHTML=game.log.join('<br>');$('growth').innerHTML=game.mode!=='flow'?'':game.skills.map((s,i)=>'<div class="row" style="margin:7px 0"><span style="color:'+colors[i]+'">'+Proto.types[i]+' 等级'+s+'／声望'+game.rep[i]+'／语料'+game.samples[i]+'</span><button data-train="'+i+'" '+(game.samples[i]<3||game.money<8?'disabled':'')+'>训练（3份＋8币）</button></div>').join('');$('labInfo').innerHTML=info(lab());draw();}
function point(e){var r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*canvas.width/r.width/cell),y:Math.floor((e.clientY-r.top)*canvas.height/r.height/cell)};}
function begin(t,e,onBoard){if(!['queued','running','withdrawn'].includes(t.state))return;selected=t.id;var p=point(e);drag={id:t.id,cells:t.cells.map(c=>c.slice()),off:onBoard?[p.x-t.x,p.y-t.y]:[0,0],x:p.x,y:p.y};e.preventDefault();render();}
canvas.onpointerdown=e=>{var p=point(e),t=game.tasks.find(t=>t.state==='running'&&t.cells.some(c=>t.x+c[0]===p.x&&t.y+c[1]===p.y));if(t)begin(t,e,true);};$('queue').onpointerdown=e=>{var c=e.target.closest('[data-id]');if(c)begin(game.tasks.find(t=>t.id===Number(c.dataset.id)),e,false);};
window.addEventListener('pointermove',e=>{if(!drag)return;var p=point(e);drag.x=p.x-drag.off[0];drag.y=p.y-drag.off[1];draw();});window.addEventListener('pointerup',e=>{if(!drag)return;var t=game.tasks.find(t=>t.id===drag.id),r=canvas.getBoundingClientRect(),q=$('queue').getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){if(!game.place(t,drag.cells,drag.x,drag.y))toast('非法位置：越界或重叠。');}else if(e.clientX>=q.left&&e.clientX<=q.right&&e.clientY>=q.top&&e.clientY<=q.bottom)game.withdraw(t);drag=null;render();});
function rotateSelected(){var t=current();if(!t||!['queued','running','withdrawn'].includes(t.state))return;if(drag){drag.cells=Proto.rotate(drag.cells);drag.off=[0,0];draw();return;}var c=Proto.rotate(t.cells);if(t.state==='running'&&!game.legal(t,c,t.x,t.y)){toast('旋转后越界或重叠，请先移动。');return;}t.cells=c;render();}
$('rotate').onclick=rotateSelected;window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&!['INPUT','SELECT'].includes(e.target.tagName)){e.preventDefault();rotateSelected();}});$('pauseTask').onclick=()=>{game.togglePause(current());render();};$('pauseAll').onclick=()=>{if(game.ended)return;playing=!playing;last=performance.now();render();};$('withdraw').onclick=()=>{game.withdraw(current());render();};$('plan').onchange=()=>{game.choose(current(),game.plans[Number($('plan').value)]);render();};$('start').onclick=()=>{if(game.ended)reset();playing=true;last=performance.now();$('start').textContent='运行中';render();};$('reset').onclick=reset;$('mode').onchange=reset;$('add').onclick=()=>{if(game.mode==='demo'||game.ended)return;selected=game.spawn().id;render();};$('step').onclick=()=>{playing=false;game.advance(1);render();};$('resume').onclick=()=>{playing=true;last=performance.now();render();};$('xp').onchange=()=>{game.xp=$('xp').checked;render();};$('bias').onchange=()=>{game.bias=$('bias').checked;render();};$('debug').onchange=render;
$('results').onclick=e=>{var b=e.target.closest('button');if(!b)return;if(b.dataset.reply)game.reply(game.tasks.find(t=>t.id===Number(b.dataset.reply)));if(b.dataset.inspect)selected=Number(b.dataset.inspect);render();};$('growth').onclick=e=>{var b=e.target.closest('[data-train]');if(b){game.train(Number(b.dataset.train));render();}};['lGet','lCheck','lRead','lWrite','lLoops','lWidth'].forEach(id=>$(id).onchange=()=>{$('labInfo').innerHTML=info(lab());});$('save').onclick=()=>{var p=lab();if(p.write&&!p.check){toast('写入要求检查通过，请加入检查。');return;}game.plans.push(p);options();var t=current();if(t&&!t.started)game.choose(t,p);toast('已保存。未开始的请求可选用。');render();};
function frame(now){var dt=(now-last)/1000;last=now;if(playing&&!game.ended)game.advance(dt*Number($('speed').value));if(now-lastRender>120){render();lastRender=now;}requestAnimationFrame(frame);}reset();requestAnimationFrame(frame);window.prototypeState=()=>game;
</script></html>
